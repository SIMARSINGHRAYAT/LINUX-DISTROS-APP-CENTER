<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#05070c" />
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.6" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#60a5fa" />
      <stop offset="70%" stop-color="#a78bfa" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.05" />
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#38bdf8" flood-opacity="0.2" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="8" y="8" width="984" height="304" rx="24" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.8" />

  <!-- Ambient Glow Circles -->
  <circle cx="160" cy="160" r="120" fill="url(#glowGrad)" filter="url(#softGlow)" />
  <circle cx="850" cy="80" r="100" fill="#a855f7" fill-opacity="0.12" filter="url(#softGlow)" />
  <circle cx="700" cy="240" r="90" fill="#38bdf8" fill-opacity="0.08" filter="url(#softGlow)" />

  <!-- Grid Accents (Subtle) -->
  <g opacity="0.07" stroke="#94a3b8" stroke-width="1">
    <line x1="300" y1="20" x2="300" y2="300" />
    <line x1="450" y1="20" x2="450" y2="300" />
    <line x1="600" y1="20" x2="600" y2="300" />
    <line x1="750" y1="20" x2="750" y2="300" />
    <line x1="900" y1="20" x2="900" y2="300" />
    <line x1="280" y1="80" x2="960" y2="80" />
    <line x1="280" y1="160" x2="960" y2="160" />
    <line x1="280" y1="240" x2="960" y2="240" />
  </g>

  <!-- Left Icon Emblem: Linux Tux + Store Grid -->
  <g transform="translate(64, 48)">
    <!-- Outer Shield / Container -->
    <rect x="0" y="0" width="168" height="216" rx="28" fill="#0f172a" stroke="url(#borderGrad)" stroke-width="2.5" filter="url(#shadow)" />
    
    <!-- Floating App Grid Inside -->
    <rect x="22" y="22" width="56" height="56" rx="14" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1.2" />
    <circle cx="50" cy="50" r="12" fill="#38bdf8" />

    <rect x="90" y="22" width="56" height="56" rx="14" fill="#818cf8" fill-opacity="0.15" stroke="#818cf8" stroke-width="1.2" />
    <!-- AI Brain Node / Star Icon -->
    <polygon points="118,36 122,46 132,50 122,54 118,64 114,54 104,50 114,46" fill="#818cf8" />

    <rect x="22" y="90" width="56" height="56" rx="14" fill="#c084fc" fill-opacity="0.15" stroke="#c084fc" stroke-width="1.2" />
    <!-- Media Play Icon -->
    <polygon points="46,104 60,118 46,132" fill="#c084fc" />

    <rect x="90" y="90" width="56" height="56" rx="14" fill="#f43f5e" fill-opacity="0.15" stroke="#f43f5e" stroke-width="1.2" />
    <!-- Terminal / CLI prompt -->
    <path d="M102 110 L110 118 L102 126 M116 126 L128 126" stroke="#f43f5e" stroke-width="2.5" stroke-linecap="round" fill="none" />

    <!-- Linux Penguin Silhouette Emblem at Bottom -->
    <g transform="translate(44, 156)">
      <!-- Tux stylized body -->
      <path d="M40 0 C22 0, 14 14, 14 26 C14 36, 10 40, 4 48 C18 52, 62 52, 76 48 C70 40, 66 36, 66 26 C66 14, 58 0, 40 0 Z" fill="#f8fafc" />
      <path d="M40 8 C28 8, 22 18, 22 28 C22 36, 18 42, 12 46 C24 49, 56 49, 68 46 C62 42, 58 36, 58 28 C58 18, 52 8, 40 8 Z" fill="#0f172a" />
      <!-- Belly -->
      <ellipse cx="40" cy="34" rx="16" ry="14" fill="#f8fafc" />
      <!-- Beak -->
      <polygon points="40,20 34,26 46,26" fill="#f59e0b" />
      <!-- Feet -->
      <ellipse cx="26" cy="48" rx="10" ry="4" fill="#f59e0b" />
      <ellipse cx="54" cy="48" rx="10" ry="4" fill="#f59e0b" />
    </g>
  </g>

  <!-- Typography & Content -->
  <g transform="translate(268, 56)">
    <!-- Pill Badge -->
    <g>
      <rect x="0" y="0" width="280" height="28" rx="14" fill="url(#badgeGrad)" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1" />
      <circle cx="14" cy="14" r="5" fill="#10b981" />
      <text x="28" y="18" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif" font-size="11.5" font-weight="600" letter-spacing="1.2">UNIVERSAL LINUX ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="78" fill="url(#titleGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif" font-size="40" font-weight="900" letter-spacing="0.5">LINUX-DISTROS-APP-CENTER</text>

    <!-- Tagline -->
    <text x="0" y="112" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif" font-size="17" font-weight="500">
      The Curated Universal Desktop Application Hub for All Linux Distributions
    </text>

    <!-- Feature Pillars Badges -->
    <g transform="translate(0, 142)">
      <!-- Badge 1: AI & ML -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="156" height="36" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1" />
        <circle cx="18" cy="18" r="4" fill="#38bdf8" />
        <text x="32" y="23" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">AI &amp; ML Suites</text>
      </g>

      <!-- Badge 2: Microsoft Apps -->
      <g transform="translate(168, 0)">
        <rect x="0" y="0" width="176" height="36" rx="10" fill="#1e293b" stroke="#818cf8" stroke-opacity="0.3" stroke-width="1" />
        <circle cx="18" cy="18" r="4" fill="#818cf8" />
        <text x="32" y="23" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Microsoft Enterprise</text>
      </g>

      <!-- Badge 3: 4K Streaming -->
      <g transform="translate(356, 0)">
        <rect x="0" y="0" width="168" height="36" rx="10" fill="#1e293b" stroke="#c084fc" stroke-opacity="0.3" stroke-width="1" />
        <circle cx="18" cy="18" r="4" fill="#c084fc" />
        <text x="32" y="23" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Media &amp; Streaming</text>
      </g>

      <!-- Badge 4: Universal Distros -->
      <g transform="translate(536, 0)">
        <rect x="0" y="0" width="150" height="36" rx="10" fill="#1e293b" stroke="#10b981" stroke-opacity="0.3" stroke-width="1" />
        <circle cx="18" cy="18" r="4" fill="#10b981" />
        <text x="32" y="23" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Cross-Distro</text>
      </g>
    </g>

    <!-- Global Outreach Tagline -->
    <g transform="translate(0, 196)">
      <text x="0" y="16" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">
        Ubuntu • Debian • Kali • Fedora • Arch • Linux Mint • Pop!_OS • openSUSE
      </text>
    </g>
  </g>
</svg>

