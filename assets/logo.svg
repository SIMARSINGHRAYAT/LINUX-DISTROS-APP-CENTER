<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <linearGradient id="logoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="logoBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="tuxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#38bdf8" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect x="12" y="12" width="232" height="232" rx="52" fill="url(#logoBg)" stroke="url(#logoBorder)" stroke-width="3" filter="url(#logoGlow)" />

  <!-- App Center 2x2 Grid Highlights in Background -->
  <g opacity="0.2">
    <rect x="42" y="42" width="76" height="76" rx="20" fill="#38bdf8" />
    <rect x="138" y="42" width="76" height="76" rx="20" fill="#818cf8" />
    <rect x="42" y="138" width="76" height="76" rx="20" fill="#c084fc" />
    <rect x="138" y="138" width="76" height="76" rx="20" fill="#10b981" />
  </g>

  <!-- Center Tux / Linux Emblem -->
  <g transform="translate(68, 52)">
    <!-- Tux Body Outer -->
    <path d="M60 0 C32 0, 20 22, 20 42 C20 58, 14 66, 4 78 C26 84, 94 84, 116 78 C106 66, 100 58, 100 42 C100 22, 88 0, 60 0 Z" fill="url(#tuxGrad)" />
    <!-- Tux Dark Coat -->
    <path d="M60 10 C40 10, 30 26, 30 44 C30 58, 22 68, 14 74 C34 78, 86 78, 106 74 C98 68, 90 58, 90 44 C90 26, 80 10, 60 10 Z" fill="#0f172a" />
    <!-- Tux White Chest / Belly -->
    <ellipse cx="60" cy="54" rx="26" ry="24" fill="#f8fafc" />
    <!-- Eyes -->
    <ellipse cx="50" cy="28" rx="4" ry="6" fill="#0f172a" />
    <circle cx="51" cy="26" r="1.5" fill="#f8fafc" />
    <ellipse cx="70" cy="28" rx="4" ry="6" fill="#0f172a" />
    <circle cx="71" cy="26" r="1.5" fill="#f8fafc" />
    <!-- Beak -->
    <polygon points="60,32 50,42 70,42" fill="#f59e0b" />
    <!-- Feet -->
    <ellipse cx="40" cy="78" rx="16" ry="7" fill="#f59e0b" />
    <ellipse cx="80" cy="78" rx="16" ry="7" fill="#f59e0b" />
  </g>

  <!-- Dynamic Orbiting Core Node Badges -->
  <circle cx="58" cy="58" r="10" fill="#38bdf8" />
  <circle cx="198" cy="58" r="10" fill="#818cf8" />
  <circle cx="58" cy="198" r="10" fill="#c084fc" />
  <circle cx="198" cy="198" r="10" fill="#10b981" />

  <!-- Bottom App Center Emblem Ribbon -->
  <g transform="translate(48, 184)">
    <rect x="0" y="0" width="160" height="28" rx="14" fill="#1e293b" stroke="url(#logoBorder)" stroke-width="1.5" />
    <text x="80" y="18" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" text-anchor="middle" letter-spacing="1.5">APP CENTER</text>
  </g>
</svg>

