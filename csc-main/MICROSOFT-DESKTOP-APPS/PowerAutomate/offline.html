<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Microsoft Power Automate - Offline</title>
    <style>
      body { display: grid; place-items: center; min-height: 100vh; margin: 0; background: #f7f7f7; color: #222; font: 16px system-ui, sans-serif; }
      main { text-align: center; }
      button { padding: .7rem 1.2rem; border: 0; border-radius: 4px; background: #0066ff; color: white; font: inherit; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline.</h1>
      <p>Check your internet connection and try again.</p>
      <button id="retry" type="button">Retry</button>
    </main>
    <script>document.getElementById('retry').addEventListener('click', () => desktopApp.retry());</script>
  </body>
</html>
